[project]
name = "agent-core"
version = "0.1.0"
description = "A tool-calling agent runtime written from scratch. No LangChain, no CrewAI, no LlamaIndex."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "rich>=13.9.0",
]

[project.scripts]
agent-core = "agent_core.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The benchmark tasks contain deliberate bugs -- a mutable default argument, a
# swallowed exception. Linting them would flag exactly what the agent is meant
# to find, and "fixing" them would destroy the benchmark.
extend-exclude = ["benchmark/tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Anything the default run must not assume: a paid API key, or a running
    # Docker daemon. One marker, so `make test` has exactly one thing to exclude.
    "integration: needs external infrastructure (paid API or Docker daemon); excluded from `make test`",
]
addopts = "-m 'not integration' --strict-markers"
