name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src/agent_core

      # Docker is available on ubuntu-latest, so the sandbox image builds and
      # the docker-marked tests run for real here even though they skip locally.
      - name: Build the sandbox image
        run: docker build -f docker/sandbox.Dockerfile -t agent-core-sandbox:latest docker/

      - name: Verify the benchmark tasks are broken and solvable
        run: python scripts/verify_benchmark_tasks.py

      - name: Test
        # No API key is set, so any test that would make a paid call must fail
        # the run rather than silently pass. The suite is designed for this.
        run: pytest -q -m "not integration"

      - name: Sandbox tests
        run: pytest -q -m docker

      - name: Benchmark harness smoke test
        run: python scripts/run_benchmark.py --dry-run --repeats 1
